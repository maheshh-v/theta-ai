<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theta — your personal AI agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5efc'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%CE%B8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span class="glyph">θ</span> Theta</div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="chat"><span class="ic">💬</span> Chat</button>
        <button class="nav-item" data-view="accounts"><span class="ic">🔗</span> Accounts
          <span class="nav-badge" id="acctBadge" hidden></span></button>
        <button class="nav-item" data-view="settings"><span class="ic">⚙️</span> Settings</button>
        <button class="nav-item" data-view="activity"><span class="ic">📊</span> Activity
          <span class="nav-badge" id="actBadge" hidden></span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <div class="status-line"><span class="dot" id="mcpDot"></span><span id="mcpText">connecting…</span></div>
        <button class="theme-toggle" id="themeToggle"><span class="ic" id="themeIcon">🌙</span><span id="themeLabel">Dark</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Chat</h1>
          <div class="sub" id="viewSub">Ask Theta to act across your Gmail and Calendar.</div>
        </div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>

      <!-- Chat -->
      <section id="view-chat" class="view">
        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chatInner"></div>
        </div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea id="composerInput" rows="1" placeholder="Message Theta…  (e.g. “Do I have any unread emails?”)"></textarea>
            <button class="btn primary" id="sendBtn">Send</button>
          </div>
          <div class="hint">Theta acts on your real accounts. Sending mail and calendar changes always ask first.</div>
        </div>
      </section>

      <!-- Accounts -->
      <section id="view-accounts" class="view hidden"><div class="wrap" id="accountsWrap"></div></section>

      <!-- Settings -->
      <section id="view-settings" class="view hidden"><div class="wrap" id="settingsWrap"></div></section>

      <!-- Activity -->
      <section id="view-activity" class="view hidden"><div class="wrap" id="activityWrap"></div></section>
    </main>
  </div>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
