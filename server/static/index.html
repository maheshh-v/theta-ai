<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theta — an agent that operates the web for you</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b4ef0'/%3E%3Ctext x='50' y='73' font-size='66' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%CE%B8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="glyph">θ</span> <span>Theta</span></div>

      <button class="new-btn" id="newTaskBtn">
        <span class="ic" data-icon="plus"></span> New task
      </button>

      <nav class="nav" id="nav" aria-label="Main">
        <div class="nav-group">
          <button class="nav-item active" data-view="ask">
            <span class="ic" data-icon="sparkle"></span> Ask
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Automate</div>
          <button class="nav-item" data-view="playbooks">
            <span class="ic" data-icon="layers"></span> Playbooks
            <span class="nav-badge" id="pbBadge" hidden></span>
          </button>
          <button class="nav-item" data-view="schedules">
            <span class="ic" data-icon="clock"></span> Schedules
            <span class="nav-badge" id="schBadge" hidden></span>
          </button>
          <button class="nav-item" data-view="activity">
            <span class="ic" data-icon="activity"></span> Activity
            <span class="nav-badge" id="runBadge" hidden></span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Setup</div>
          <button class="nav-item" data-view="connections">
            <span class="ic" data-icon="plug"></span> Connections
            <span class="nav-badge" id="connBadge" hidden></span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="ic" data-icon="sliders"></span> Settings
          </button>
        </div>
      </nav>

      <div class="sidebar-foot">
        <div class="status-line" id="statusLine" title="Model status">
          <span class="dot" id="statusDot"></span><span id="statusText">starting…</span>
        </div>
        <button class="theme-toggle" id="themeToggle">
          <span class="ic" data-icon="moon" id="themeIcon"></span><span id="themeLabel">Dark</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open navigation">
          <span class="ic" data-icon="menu"></span>
        </button>
        <div class="topbar-titles">
          <h1 id="viewTitle">Ask</h1>
          <div class="sub" id="viewSub">Tell Theta what to do and watch it work.</div>
        </div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>

      <!-- Ask -->
      <section id="view-ask" class="view">
        <div class="ask-split">
          <div class="thread-scroll" id="threadScroll">
            <div class="thread" id="thread"></div>
          </div>
          <aside class="rail" id="rail" hidden>
            <div class="rail-head">
              <span class="live-dot" id="liveDot"></span>
              <span class="rail-title">Live browser</span>
              <span class="rail-step" id="railStep"></span>
            </div>
            <div class="rail-url" id="railUrl">
              <span class="ic" data-icon="globe"></span><span>about:blank</span>
            </div>
            <div class="rail-shot" id="railShot">
              <div class="rail-empty">The page appears here as soon as Theta opens one.</div>
            </div>
            <div class="rail-note" id="railNote"></div>
          </aside>
        </div>

        <div class="composer-wrap">
          <div class="composer">
            <textarea id="composerInput" rows="1" aria-label="What should Theta do?"
              placeholder="Ask Theta to do something — on the web, in Gmail, or in Notion…"></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Run">
              <span class="ic" data-icon="arrow-up"></span>
            </button>
          </div>
          <div class="composer-hint" id="composerHint">
            <span class="ic" data-icon="shield"></span>
            <span>Theta asks before anything irreversible, and never types a password.</span>
          </div>
        </div>
      </section>

      <section id="view-playbooks" class="view hidden"><div class="page" id="playbooksPage"></div></section>
      <section id="view-schedules" class="view hidden"><div class="page" id="schedulesPage"></div></section>
      <section id="view-activity" class="view hidden"><div class="page" id="activityPage"></div></section>
      <section id="view-connections" class="view hidden"><div class="page" id="connectionsPage"></div></section>
      <section id="view-settings" class="view hidden"><div class="page" id="settingsPage"></div></section>
    </main>
  </div>

  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
